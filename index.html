<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DSA Master – 180 Problem Roadmap</title>
  <meta name="description" content="A concept-first roadmap of 180 curated LeetCode problems for mid-level interviews. Learn each pattern, solve the problems, and track your progress in your browser." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 22l5-12 4 8 2-4 3 8' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem("dsa-master-v1") || "{}").theme;
      if (t) document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32"><path d="M9 22l5-12 4 8 2-4 3 8" /></svg>
        </span>
        <span>DSA Master</span>
      </a>
      <nav class="nav">
        <a href="#/" data-nav="home">Roadmap</a>
        <a href="#/review" data-nav="review">Review <span id="review-badge" class="badge" hidden></span></a>
        <a href="#/guide" data-nav="guide">How to use</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="toggle-theme" title="Toggle theme" aria-label="Toggle theme">
          <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <div class="menu-wrap">
          <button class="icon-btn" data-action="toggle-menu" title="Progress options" aria-label="Progress options" aria-haspopup="true">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
          </button>
          <div class="menu" id="menu" hidden>
            <button data-action="export">Export progress (.json)</button>
            <button data-action="import">Import progress…</button>
            <hr />
            <button data-action="reset" class="danger">Reset all progress</button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1"></main>

  <footer class="footer container">
    <p>Your progress is saved in this browser only. Export it to back it up or move it to another device.</p>
  </footer>

  <input type="file" id="import-file" accept="application/json,.json" hidden />
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

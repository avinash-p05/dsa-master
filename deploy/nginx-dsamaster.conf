# Nginx site for DSA Master when the server already runs Nginx on 80/443.
#
#   sudo cp deploy/nginx-dsamaster.conf /etc/nginx/sites-available/dsamaster
#   sudo ln -s /etc/nginx/sites-available/dsamaster /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d dsamaster.duckdns.org     # adds HTTPS + http->https redirect
#
# Change 8080 below if you set a different APP_PORT in .env.

server {
    listen 80;
    listen [::]:80;
    server_name dsamaster.duckdns.org;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Spring Boot uses these to build the correct https:// OAuth redirect URI.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
    }

    # Fingerprinted build assets never change.
    location /assets/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

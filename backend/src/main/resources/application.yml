# Shared defaults. Profile files override these:
#   application-dev.yml  -> local development (H2 file DB, dev login)
#   application-prod.yml -> production (PostgreSQL, secure cookies)
spring:
  application:
    name: dsa-master
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never # tables are created by Flyway

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust X-Forwarded-* from the reverse proxy
  servlet:
    session:
      timeout: 30d
      cookie:
        name: DSA_SESSION
        http-only: true
        same-site: lax
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  progress:
    max-entries-per-user: 2000
    max-note-length: 10000

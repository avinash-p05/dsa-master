# Shared defaults. Profile files override these:
#   application-dev.yml  -> local development (Docker Postgres + Mailpit, dev login)
#   application-prod.yml -> production (secure cookies, real SMTP)
spring:
  application:
    name: dsa-master
  config:
    # Optional KEY=value file next to where the app is started (backend/.env when
    # running with mvnw). Handy for local OAuth/SMTP credentials; never committed.
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    jdbc:
      initialize-schema: never # tables are created by Flyway

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework # trust X-Forwarded-* from the reverse proxy
  servlet:
    session:
      timeout: 30d
      cookie:
        name: DSA_SESSION
        http-only: true
        same-site: lax
        max-age: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  # Public URL of the site, used in links inside emails.
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mail:
    from: ${MAIL_FROM:DSA Master <no-reply@localhost>}
  auth:
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:true}
    verification-token-ttl: 24h
    reset-token-ttl: 1h
  oauth:
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  progress:
    max-entries-per-user: 2000
    max-note-length: 10000

# Production: PostgreSQL. All secrets come from environment variables
# (see .env.example).
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dsamaster}
    username: ${DB_USERNAME:dsamaster}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

server:
  servlet:
    session:
      cookie:
        secure: true

app:
  dev-login-enabled: false
  auth:
    # Release 1.0.1 ships GitHub sign-in only. Email/password (with SMTP
    # verification) is built in; set PASSWORD_LOGIN_ENABLED=true once SMTP is configured.
    password-login-enabled: ${PASSWORD_LOGIN_ENABLED:false}

logging:
  level:
    root: INFO

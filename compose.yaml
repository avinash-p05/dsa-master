# DSA Master: a self-contained app module for a server laid out as
#
#   ~/edge      shared Caddy reverse proxy / API gateway on 80/443
#   ~/platform  shared PostgreSQL ("platform-postgres"), Redis, Kafka
#   ~/<app>     one compose project per app
#
# This stack runs a single container. It publishes no host ports and sits on its own
# private network "app-dsa-master", shared only with the edge proxy and Postgres
# (so other apps on the server can't reach it):
#   - the edge proxy reaches it as        dsa-master:8080
#   - it reaches its own database at       platform-postgres:5432/dsamaster
#
# First deploy (see deploy/DEPLOY.md):
#   docker network create app-dsa-master                   # once; listed in ~/edge and ~/platform compose
#   cp .env.example .env                                   # fill it in
#   APP_DB_PASSWORD=<DB_PASSWORD> ~/platform/create-app-db.sh dsamaster
#   docker compose up -d --build
#   cp deploy/edge/dsa-master.caddy ~/edge/sites/ && ~/edge/reload.sh
# Update:
#   git pull && docker compose up -d --build
name: dsa-master

services:
  app:
    build: .
    image: dsa-master:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://platform-postgres:5432/dsamaster
      DB_USERNAME: dsamaster
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
      # Links inside emails point here.
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # Outgoing email (verification + password reset) over any SMTP provider.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    mem_limit: 768m
    networks:
      app-dsa-master:
        # The name the edge proxy uses: reverse_proxy dsa-master:8080
        aliases: [dsa-master]

networks:
  # Created once per server; edge-caddy and platform-postgres join it too.
  app-dsa-master:
    external: true

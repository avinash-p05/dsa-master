# DSA Master: a self-contained app module for a server laid out as
#
#   ~/edge      shared Caddy reverse proxy on 80/443   (Docker network "edge")
#   ~/platform  shared PostgreSQL ("platform-postgres") (Docker network "platform")
#   ~/<app>     one compose project per app, joining those networks
#
# This stack runs a single container. It publishes no host ports:
#   - the edge proxy reaches it as        dsa-master:8080
#   - it reaches its own database at       platform-postgres:5432/dsamaster
#
# First deploy (see deploy/DEPLOY.md):
#   cp .env.example .env                                   # fill it in
#   APP_DB_PASSWORD=<DB_PASSWORD> ~/platform/create-app-db.sh dsamaster
#   docker compose up -d --build
#   cp deploy/edge/dsa-master.caddy ~/edge/sites/ && ~/edge/reload.sh
# Update:
#   git pull && docker compose up -d --build
name: dsa-master

services:
  app:
    build: .
    image: dsa-master:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://platform-postgres:5432/dsamaster
      DB_USERNAME: dsamaster
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
      # Links inside emails point here.
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # Outgoing email (verification + password reset) over any SMTP provider.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    mem_limit: 768m
    networks:
      edge:
        # The name the edge proxy uses: reverse_proxy dsa-master:8080
        aliases: [dsa-master]
      platform: {}

networks:
  # Both are created once per server (docker network create edge / platform).
  edge:
    external: true
  platform:
    external: true

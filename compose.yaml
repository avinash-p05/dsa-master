# Production stack for a single VPS (e.g. Contabo):
#   caddy  -> HTTPS on 80/443 (automatic Let's Encrypt certificates)
#   app    -> Spring Boot jar serving the SPA at "/" and the API at "/api"
#   db     -> PostgreSQL 17 (not exposed to the internet)
#
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
services:
  db:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsamaster
      POSTGRES_USER: dsamaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsamaster -d dsamaster"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: dsa-master:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/dsamaster
      DB_USERNAME: dsamaster
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Links inside emails point here.
      APP_BASE_URL: https://${DOMAIN}
      # Outgoing email (verification + password reset) over any SMTP provider.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # Only reachable through Caddy (and from the server itself for debugging).
    ports:
      - "127.0.0.1:8080:8080"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  caddy-data:
  caddy-config:

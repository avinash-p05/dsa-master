# DSA Master: a self-contained app module for a server that runs a shared
# "edge" reverse proxy (one Caddy owning ports 80/443 for every app).
#
#   app -> Spring Boot jar (SPA at "/", API at "/api"), reachable ONLY on the
#          shared Docker network "edge" as  dsa-master:8080  (no host ports)
#   db  -> PostgreSQL 17, private to this stack
#
# One-time server setup: the edge proxy and its network (see deploy/DEPLOY.md).
# Deploy / update this app without touching anything else:
#   cp .env.example .env              # first time only
#   docker compose up -d --build
# Then register the site with the edge proxy (first time only):
#   cp deploy/edge/dsa-master.caddy ~/edge/sites/ && ~/edge/reload.sh
services:
  db:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dsamaster
      POSTGRES_USER: dsamaster
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsamaster -d dsamaster"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - default

  app:
    build: .
    image: dsa-master:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/dsamaster
      DB_USERNAME: dsamaster
      DB_PASSWORD: ${DB_PASSWORD}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      PASSWORD_LOGIN_ENABLED: ${PASSWORD_LOGIN_ENABLED:-false}
      # Links inside emails point here.
      APP_BASE_URL: https://${DOMAIN:?Set DOMAIN in .env}
      # Outgoing email (verification + password reset) over any SMTP provider.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    networks:
      default: {}
      edge:
        # The name the edge proxy uses: reverse_proxy dsa-master:8080
        aliases: [dsa-master]

networks:
  # Created once per server: docker network create edge
  edge:
    external: true

volumes:
  db-data:
